name: 'Update GitOps Image Tag'
description: 'Updates container image tags in GitOps repository using yq'

inputs:
  repository:
    description: 'Target GitOps repository'
    required: false
    default: 'infrastructure-as-code'
  workload-name:
    description: 'Name of the workload (e.g., dash)'
    required: true
  environment:
    description: 'Target environment'
    required: true
    # Valid options: lab, dev, prod
  directory-path:
    description: 'Directory path to the file to update'
    required: true
  file-to-update:
    description: 'File to update in the GitOps repository'
    required: false
    default: 'values.yaml'
  yq-path:
    description: 'YQ YAML path to the field to update'
    required: false
    default: '.image.tag'
  tag:
    description: 'Container image tag to set'
    required: true
  gitops-repo-updater-private-key:
    description: 'GitHub App private key for accessing the GitOps repository'
    required: true
  gitops-repo-updater-app-id:
    description: 'GitHub App ID for accessing the GitOps repository'
    required: true

outputs:
  commit-sha:
    description: 'SHA of the commit created in the GitOps repository'
    value: ${{ steps.push-changes.outputs.commit-sha }}

runs:
  using: 'composite'
  steps:
    - name: Obtain a GitHub App Installation Access Token
      id: githubAppAuth
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.gitops-repo-updater-app-id }}
        private-key: ${{ inputs.gitops-repo-updater-private-key }}
        owner: varianter
        repositories: ${{ inputs.repository }}

    - name: Checkout GitOps repository
      uses: actions/checkout@v7
      with:
        token: ${{ steps.githubAppAuth.outputs.token }}
        repository: varianter/${{ inputs.repository }}
        path: gitops-repo

    - name: Install yq
      env:
        YQ_VERSION: v4.54.1
        YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
      run: |
        curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
        echo "${YQ_SHA256}  /tmp/yq" | sha256sum --check
        sudo install -m 0755 /tmp/yq /usr/local/bin/yq
        yq --version
      shell: bash

    - name: Update image tag using yq
      env:
        DIRECTORY_PATH: ${{ inputs.directory-path }}
        FILE_TO_UPDATE: ${{ inputs.file-to-update }}
        YQ_PATH: ${{ inputs.yq-path }}
        TAG: ${{ inputs.tag }}
      run: |
        cd gitops-repo
        FILE_PATH="$DIRECTORY_PATH/$FILE_TO_UPDATE"

        if [ ! -f "$FILE_PATH" ]; then
          echo "Error: File $FILE_PATH does not exist"
          exit 1
        fi

        echo "Updating $FILE_PATH"
        echo "Setting $YQ_PATH to $TAG"

        yq eval "$YQ_PATH = strenv(TAG)" -i "$FILE_PATH"

        echo "Updated content:"
        cat "$FILE_PATH"
      shell: bash

    - name: Configure Git
      run: |
        cd gitops-repo
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
      shell: bash

    - name: Commit and push changes
      id: push-changes
      env:
        DIRECTORY_PATH: ${{ inputs.directory-path }}
        FILE_TO_UPDATE: ${{ inputs.file-to-update }}
        WORKLOAD_NAME: ${{ inputs.workload-name }}
        TAG: ${{ inputs.tag }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        cd gitops-repo

        if git diff --quiet; then
          echo "No changes to commit"
          echo "commit-sha=" >> $GITHUB_OUTPUT
          exit 0
        fi

        git add "$DIRECTORY_PATH/$FILE_TO_UPDATE"
        git config pull.rebase true

        # Try to push with retry logic
        MAX_RETRIES=5
        RETRY_COUNT=0

        git commit -m "feat: deploy $WORKLOAD_NAME with image tag $TAG to $ENVIRONMENT"

        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          if git push; then
            echo "Successfully pushed changes"
            break
          else
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            echo "Push failed, attempt $RETRY_COUNT of $MAX_RETRIES. Pulling with rebase and retrying..."
            git pull --rebase
          else
            echo "Push failed after $MAX_RETRIES attempts"
            exit 1
          fi
          fi
        done

        COMMIT_SHA=$(git rev-parse HEAD)
        echo "commit-sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
        echo "Successfully pushed changes. Commit SHA: $COMMIT_SHA"
      shell: bash
