name: Build and Deploy (Shared)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (e.g. dev, prod)'
        required: true
        type: string
      acr-url:
        description: 'Azure Container Registry login server (e.g. example.azurecr.io)'
        required: true
        type: string
      image-name:
        description: 'Container image name (repository) to build and push'
        required: true
        type: string
      docker-context:
        description: 'Build context to pass to docker/build-push-action'
        required: false
        default: .
        type: string
      dockerfile:
        description: 'Path to the Dockerfile used during build'
        required: false
        default: ./Dockerfile
        type: string
      build-args:
        description: 'Optional newline-separated Docker build arguments (KEY=value)'
        required: false
        default: ''
        type: string
      enable-gitops:
        description: "Set to 'false' (string) to skip GitOps update step"
        required: false
        default: 'true'
        type: string
      gitops-repository:
        description: 'Repository that hosts the GitOps deployment manifests'
        required: false
        default: infrastructure-as-code
        type: string
      gitops-directory-path:
        description: 'Relative path inside the GitOps repository to the manifest to update'
        required: false
        default: ''
        type: string
      gitops-file-to-update:
        description: 'Manifest filename to update within the directory path'
        required: false
        default: values.yaml
        type: string
      gitops-yq-path:
        description: 'yq path that resolves to the image tag field'
        required: false
        default: .image.tag
        type: string
      gitops-workload-name:
        description: 'Friendly workload name used in the GitOps commit message'
        required: false
        default: ''
        type: string
      gitops-continue-on-error:
        description: "Set to 'false' (string) to fail the workflow if the GitOps step cannot push"
        required: false
        default: 'true'
        type: string
      debug-metadata:
        description: 'Set to true to print docker/metadata-action outputs'
        required: false
        default: 'false'
        type: string
    outputs:
      image-tag:
        description: 'Image tag that was built and pushed'
        value: ${{ jobs.build-and-push.outputs.image-tag }}
      gitops-commit-sha:
        description: 'Commit pushed to the GitOps repo (empty if GitOps is disabled, nothing changed, or the push failed). Pass to check-argocd-shared as expected-revision.'
        value: ${{ jobs.build-and-push.outputs.gitops-commit-sha }}
    secrets:
      VARIANT_ACR_CONTAINER_PUSH_USERNAME:
        description: 'Username with push access to the Azure Container Registry'
        required: true
      VARIANT_ACR_CONTAINER_PUSH_SECRET:
        description: 'Password or token with push access to the Azure Container Registry'
        required: true
      VARIANT_GITHUB_REPO_UPDATER_APP_ID:
        description: 'GitHub App ID used when updating the GitOps repository'
        required: false
      VARIANT_GITHUB_REPO_UPDATER_PRIVATEKEY:
        description: 'GitHub App private key for updating the GitOps repository'
        required: false

permissions: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      ACR_URL: ${{ inputs['acr-url'] }}
      IMAGE_NAME: ${{ inputs['image-name'] }}
    outputs:
      image-tag: ${{ steps.sha-tag.outputs.tag }}
      gitops-commit-sha: ${{ steps.update-gitops.outputs.commit-sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Azure Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.ACR_URL }}
          username: ${{ secrets.VARIANT_ACR_CONTAINER_PUSH_USERNAME }}
          password: ${{ secrets.VARIANT_ACR_CONTAINER_PUSH_SECRET }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Debug metadata outputs
        if: inputs.debug-metadata == 'true'
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          META_VERSION: ${{ steps.meta.outputs.version }}
          META_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          echo "Tags: $META_TAGS"
          echo '---'
          echo "Version: $META_VERSION"
          echo '---'
          echo "Labels: $META_LABELS"

      - name: Extract SHA tag for GitOps
        id: sha-tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          SHA_TAG=$(echo "$TAGS" | grep -oP '(?<=:)[a-zA-Z0-9/_-]+-[a-f0-9]{7}$' | head -n 1)
          if [ -z "$SHA_TAG" ]; then
            SHA_TAG="$VERSION"
          fi
          echo "Extracted tag: $SHA_TAG"
          echo "tag=$SHA_TAG" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs['docker-context'] }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs['build-args'] }}
          cache-from: type=registry,ref=${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Image pushed with digest $DIGEST"

      - name: Deploy to ${{ env.ENVIRONMENT }} (Update GitOps repository with new image tag)
        id: update-gitops
        if: inputs['enable-gitops'] == 'true'
        continue-on-error: ${{ inputs['gitops-continue-on-error'] == 'true' }}
        uses: varianter/shared-workflows/.github/actions/update-gitops-image-tag@main
        with:
          repository: ${{ inputs['gitops-repository'] }}
          environment: ${{ env.ENVIRONMENT }}
          workload-name: ${{ inputs['gitops-workload-name'] }}
          directory-path: ${{ inputs['gitops-directory-path'] }}
          file-to-update: ${{ inputs['gitops-file-to-update'] }}
          yq-path: ${{ inputs['gitops-yq-path'] }}
          tag: ${{ steps.sha-tag.outputs.tag }}
          gitops-repo-updater-private-key: ${{ secrets.VARIANT_GITHUB_REPO_UPDATER_PRIVATEKEY }}
          gitops-repo-updater-app-id: ${{ secrets.VARIANT_GITHUB_REPO_UPDATER_APP_ID }}
